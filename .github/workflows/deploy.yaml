name: Deploy

on:
  push:
    branches:
      - dev
      - main
      - fix/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.13

      - name: Deploy
        env: # Or as an environment variable
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RIN_GITHUB_CLIENT_ID: ${{ secrets.RIN_GITHUB_CLIENT_ID }}
          RIN_GITHUB_CLIENT_SECRET: ${{ secrets.RIN_GITHUB_CLIENT_SECRET }}

          DB_NAME: ${{ vars.DB_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          IMG_BUCKET: ${{ vars.IMG_BUCKET }}
          IMG_FOLDER: ${{ vars.IMG_FOLDER }}
          IMG_ACCESS_HOST: ${{ vars.IMG_ACCESS_HOST }}
          FILE_BUCKET: ${{ vars.FILE_BUCKET }}
          FILE_FOLDER: ${{ vars.FILE_FOLDER }}
          FILE_ACCESS_HOST: ${{ vars.FILE_ACCESS_HOST }}
          CACHE_BUCKET: ${{ vars.CACHE_BUCKET }}
          CACHE_FOLDER: ${{ vars.CACHE_FOLDER }}
          CACHE_ACCESS_HOST: ${{ vars.CACHE_ACCESS_HOST }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          RSS_TITLE: ${{ vars.RSS_TITLE }}
          RSS_DESCRIPTION: ${{ vars.RSS_DESCRIPTION }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          cd Rin/
          bun install --frozen-lockfile
          bun scripts/migrator.ts

      - name: Update SEO transform rule (best effort, 不阻塞部署)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          cd Rin/
          bun scripts/update-seo-rule.ts \
            || echo "::warning::SEO 转换规则更新失败，见上方输出（不影响本次部署）"
